<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="login.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
</head>
<body>
    <div class="kullanıcı">
        <label>
            <h2>Giriş Yap</h2>
            <div class="KullanıcıAdı">
                <form >
                    Kullanıcı Adı <br><input type="text" maxlength="16" minlength="9">
                </form>
            
            </div>
            <div class="Şifre">
                <form >
                    Şifre <br><input type="password" maxlength="11" minlength="5">
                </form>
            </div>
            <div class="düğme">
                <button>Giriş Yap</button>
            </div>
        </label>
        <div class="remember"><a href="">Şifremi Unuttum</a></div>
    </div>
</body>
</html>
